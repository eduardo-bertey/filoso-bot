[bot]
name = "FilosoBot"
language = "es"
admin_ids = []
allowed_chats = []
allowed_threads = []
allow_all_chats = true

[telegram]
poll_timeout = 30
parse_mode = "Markdown"
max_message_length = 4000

[ai]
enabled = false
default_provider = ""
default_model = ""
temperature = 0.7
max_tokens = 900
system_prompt = "Sos un asistente en Telegram. Respondé en español, breve y claro. Usá Markdown simple. Si no sabés algo, decilo."
timeout = 60
cooldown_seconds = 300
context_messages = 6

[qa]
enabled = true
fallback_to_ai = true
data_file = "data/qa.json"

[filters]
blocked_words = []
muted_users = []
allowed_domains = []

[providers]

[providers.openai]
style = "openai"
base_url = "https://api.openai.com/v1"
chat_path = "/chat/completions"
models = ["gpt-4o-mini"]
enabled = false
priority = 10
timeout = 60

[providers.openrouter]
style = "openai"
base_url = "https://openrouter.ai/api/v1"
chat_path = "/chat/completions"
models = ["meta-llama/llama-3.3-70b-instruct"]
enabled = false
priority = 20
timeout = 60

[providers.openrouter.extra_headers]
HTTP-Referer = "https://github.com/emanuelbertey/FilosoIA"
X-Title = "FilosoBot"

[providers.groq]
style = "openai"
base_url = "https://api.groq.com/openai/v1"
chat_path = "/chat/completions"
models = ["llama-3.3-70b-versatile"]
enabled = false
priority = 20
timeout = 45

[providers.mistral]
style = "openai"
base_url = "https://api.mistral.ai/v1"
